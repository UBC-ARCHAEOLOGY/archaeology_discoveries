name: Phase 2A monitoring dry run
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Offline replay or bounded API retrieval (no publication)
        type: choice
        options: [offline, live]
        default: offline
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Test monitor offline
        run: python -m unittest discover -s monitoring -p 'test_*.py' -v
      - name: Prepare candidate proposals only
        env:
          MONITOR_MODE: ${{ inputs.mode }}
        run: python monitoring/monitor.py --mode "$MONITOR_MODE" --output monitoring/runs/dry-run --verify-dois
      - name: Upload reports and raw replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monitoring-phase2a-dry-run
          path: monitoring/runs/
          retention-days: 14
