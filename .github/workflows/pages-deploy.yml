name: Deploy Quarto site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages-v21-qa
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/configure-pages@v5
      - name: Install image integration dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow playwright ftfy
      - name: Prepare local Leaflet world-map assets
        run: |
          if [ ! -f map-assets/leaflet.js ] || [ ! -f map-assets/countries.geojson ]; then
            npm install --no-save --silent leaflet@1.9.4 world-atlas@2 topojson-client@3
            mkdir -p map-assets
            cp node_modules/leaflet/dist/leaflet.js map-assets/leaflet.js
            cp node_modules/leaflet/dist/leaflet.css map-assets/leaflet.css
            node scripts/build_map_assets.js
          fi
      - name: Enrich APA publication sections
        run: python scripts/enrich_publications.py
      - name: Normalize bilingual content and media tiers
        run: python scripts/normalize_bilingual_media.py
      - name: Check bilingual discovery-page structure
        run: python scripts/check_bilingual.py
      - name: Fetch licence-cleared publication figures
        run: python scripts/fetch_licensed_images.py
      - name: Cache licence-cleared figures in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/discoveries discoveries/*.qmd map-assets
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply V2.1 QA enrichment and cache figures [skip ci]"
            git push
          fi
      - name: Render Quarto site
        run: quarto render
      - name: Check rendered internal and external links
        run: python scripts/check_links.py
      - name: Install CJK fonts for visual QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
      - name: Capture desktop and mobile visual QA
        run: python scripts/capture_visual_qa.py
      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: qa-screenshots
          retention-days: 1
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
