name: Deploy Quarto site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: actions/configure-pages@v5
      - name: Install image integration dependencies
        run: python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Fetch licence-cleared publication figures
        run: python scripts/fetch_licensed_images.py
      - name: Cache licence-cleared figures in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/discoveries
          if ! git diff --cached --quiet; then
            git commit -m "chore: cache licence-cleared publication figures [skip ci]"
            git push
          fi
      - name: Render Quarto site
        run: quarto render
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
