name: Editorial consistency QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Test consistency checker
        run: python -m unittest discover -s scripts -p 'test_editorial_qa.py' -v
      - name: Check source corpus
        run: |
          python scripts/check_bilingual.py
          python scripts/editorial_qa.py --json /tmp/editorial-source.json
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: '1.11.9'
      - name: Render without retaining automatic gitignore edits
        shell: bash
        run: |
          set -euo pipefail
          backup_file=$(mktemp)
          cp .gitignore "$backup_file"
          trap 'cp "$backup_file" .gitignore; rm -f "$backup_file"' EXIT
          quarto render
      - name: Check rendered links and fragments
        run: python scripts/editorial_qa.py --rendered docs --json /tmp/editorial-rendered.json
      - name: Upload academic review findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editorial-qa-findings
          path: /tmp/editorial-*.json
